# Customatic + Postgres. Set BETTER_AUTH_SECRET and APP_URL in a .env file next to this one, then: docker compose up -d
services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://customatic:customatic@db:5432/customatic
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: customatic
      POSTGRES_PASSWORD: customatic
      POSTGRES_DB: customatic
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customatic"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
